<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible"
          content="ie=edge">
    <title>Reaction game</title>
    <link rel="stylesheet"
          href="styles.css">
</head>
<body>
<div class="screen">
    <h1>Aim Training</h1>
    <a href="#"
       class="start"
       id="start">НАЧАТЬ ИГРУ</a>
</div>

<div class="screen">
    <h1>Выберите время</h1>
    <ul class="time-list"
        id="time-list">
        <li>
            <button class="time-btn"
                    date-time='10'>
                10 сек
            </button>
        </li>
        <li>
            <button class="time-btn"
                    date-time='20'>
                20 сек
            </button>
        </li>
        <li>
            <button class="time-btn"
                    date-time='30'>
                30 сек
            </button>
        </li>
    </ul>
</div>

<div class="screen">
    <h3>Осталось <span id="time">00:00</span></h3>
    <div class="board"
         id="board"></div>
</div>
<script src="script.js"></script>
</body>
</html>
